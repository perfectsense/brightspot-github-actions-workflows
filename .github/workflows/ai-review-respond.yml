name: AI Review - Respond

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  respond:
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event_name == 'pull_request_review_comment' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request))
    runs-on: ubuntu-22.04
    steps:
      - name: Check ai-review custom property
        id: config
        run: |
          RAW=$(gh api repos/${{ github.repository }}/properties/values \
            --jq '.[] | select(.property_name == "ai-review") | .value' \
            2>/dev/null || echo "")
          echo "tool=${RAW}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check out the repository
        if: steps.config.outputs.tool == 'claude'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Respond to @claude mention
        if: steps.config.outputs.tool == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Grep,mcp__github_inline_comment__create_inline_comment,Read"
