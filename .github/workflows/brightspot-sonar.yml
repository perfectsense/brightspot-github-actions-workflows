name: 'Brightspot Sonar'

# Standalone, reusable Sonar analysis.
#
# Invoke it as its OWN top-level job in the caller, with `needs: build` so it
# runs after the build (warm Gradle remote cache; skipped if the build fails) —
# but keep `deploy` gated only on `build`, NOT on sonar, so Sonar never blocks
# or delays the deploy and a failing quality gate can't fail the release:
#
#   jobs:
#     build:
#       uses: perfectsense/brightspot-github-actions-workflows/.github/workflows/brightspot-build.yml@v2
#       secrets: inherit
#     deploy:
#       needs: build            # NOT sonar — deploy never waits on Sonar
#       uses: perfectsense/brightspot-github-actions-workflows/.github/workflows/aws-cloud-deploy.yml@v2
#       secrets: inherit
#     sonar:
#       needs: build            # runs after build; reuses its warm Gradle cache
#       uses: perfectsense/brightspot-github-actions-workflows/.github/workflows/brightspot-sonar.yml@v2
#       secrets: inherit        # required so the dynamic SONAR_TOKEN_<instance> resolves
#
# Token: by default the dynamic SONAR_TOKEN_<instance> secret resolves only under
# `secrets: inherit`. A caller that can't use `secrets: inherit` (e.g. it needs an
# explicit `secrets:` map to pass other values) can instead supply the token through
# the generic env-var passthrough, which takes precedence over the dynamic secret:
#
#     sonar:
#       needs: build
#       uses: perfectsense/brightspot-github-actions-workflows/.github/workflows/brightspot-sonar.yml@v2
#       secrets:
#         ENV_1_VALUE: ${{ secrets.SONAR_TOKEN_02 }}
#         GRADLE_CACHE_USERNAME: ${{ secrets.GRADLE_CACHE_USERNAME }}
#         GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}
#         GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
#       with:
#         env1Name: SONAR_TOKEN
#
# Runs only when the repo has the `sonar` custom property set (e.g. `02`), which
# selects the SonarQube instance and token. It is self-contained: it does its own
# Gradle build (tests run so Sonar gets coverage data). To keep that fast, its build
# steps mirror brightspot-build.yml exactly — same steps, same build-gradle.sh, same
# version stamping — so a caller that uses both workflows gets identical Gradle cache
# keys and this build reuses the build job's warm remote cache. java-version is the
# build JDK (matches brightspot-build.yml); the scanner uses sonar-java-version.

on:
  workflow_call:
    inputs:
      java-distribution:
        description: 'Java distribution'
        required: false
        default: 'temurin'
        type: string
      # NOTE: keep this default in sync with brightspot-build.yml's java-version so a
      # caller that uses both workflows with defaults builds on the same JDK in each
      # and the Gradle cache keys match.
      java-version:
        description: >-
          JDK that runs the "Build with Gradle" step (compile/test/enhance). Same
          meaning and default (11) as brightspot-build.yml's java-version, so a
          caller using both workflows with defaults gets matching Gradle cache keys
          and this build reuses the build job's warm remote cache. If your build
          workflow overrides java-version, set the same value here. The Sonar scan
          itself runs on sonar-java-version, not this. Set to '' to build on
          sonar-java-version instead.
        required: false
        default: '11'
        type: string
      sonar-java-version:
        description: >-
          Java version for the Sonar scanner only (must be 17+; defaults to 21). The
          scan may run on a newer JDK than the build, which uses java-version.
        required: false
        default: '21'
        type: string
      # NOTE: keep this default in sync with brightspot-build.yml so a caller that
      # relies on the default builds the frontend the same way in both workflows.
      node-version:
        description: 'Node version'
        required: false
        default: '16.11.0'
        type: string
      gradle-params:
        description: >-
          Extra parameters to pass to the Gradle command. Pass the SAME value here
          as to brightspot-build.yml so both builds are identical and share cache.
        required: false
        type: string
      cache-npm:
        description: 'Cache NPM'
        default: true
        type: boolean
      # NOTE: this is complementary to the Gradle remote build cache. The remote cache
      # stores task outputs; this one stores the Gradle User Home (wrapper distribution,
      # dependency jars, compiled build scripts) and configuration-cache data, which the
      # remote cache never covers. Keep it enabled even when using the remote cache.
      gradle-action-cache-disable:
        description: 'Disable the setup-gradle GitHub Actions cache (Gradle User Home + configuration-cache data)'
        required: false
        default: false
        type: boolean
      runs-on:
        description: Platform to execute on
        type: string
        default: sonar-ubuntu-22.04-4core

      fail-on-error:
        description: >-
          Fail the workflow when the Sonar analysis itself errors. Keep true for a
          standalone job (failures stay visible and don't block deploy, since
          deploy needn't depend on it). Set false when bundling into a build
          workflow so a Sonar/infra failure can't fail the build and block deploy.
        required: false
        default: true
        type: boolean

      env1Name:
        description: Name for environment variable #1 (value is passed via secrets)
        type: string
      env2Name:
        description: Name for environment variable #2 (value is passed via secrets)
        type: string
      env3Name:
        description: Name for environment variable #3 (value is passed via secrets)
        type: string

    secrets:
      ENV_1_VALUE:
        required: false
      ENV_2_VALUE:
        required: false
      ENV_3_VALUE:
        required: false
      GRADLE_CACHE_USERNAME:
        required: false
      GRADLE_CACHE_PASSWORD:
        required: false
      # AES key (e.g. `openssl rand -base64 16`) used by setup-gradle to encrypt
      # configuration-cache data before storing it in the GitHub Actions cache.
      # Without it, configuration-cache data is not saved between runs (the rest of
      # the Gradle User Home still is).
      GRADLE_ENCRYPTION_KEY:
        required: false

jobs:
  sonar:
    name: "Sonar"
    # Dependabot can't read the dynamic token; the per-step guard below skips
    # repos that don't have the `sonar` property set.
    # Org kill-switch: skip entirely when the SONAR_02_ENABLED variable is 'false'.
    if: ${{ github.actor != 'dependabot[bot]' && vars.SONAR_02_ENABLED != 'false' }}
    # When fail-on-error is false (e.g. bundled into a build workflow), tolerate a
    # Sonar/infra failure so it can't fail the build and block the deploy.
    continue-on-error: ${{ !inputs.fail-on-error }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Set Environment Variables
        run: |
          if [ -n "${{ inputs.env1Name }}" ]; then
            echo "${{ inputs.env1Name }}=${{ secrets.ENV_1_VALUE }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.env2Name }}" ]; then
            echo "${{ inputs.env2Name }}=${{ secrets.ENV_2_VALUE }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.env3Name }}" ]; then
            echo "${{ inputs.env3Name }}=${{ secrets.ENV_3_VALUE }}" >> $GITHUB_ENV
          fi
      - name: Read the `sonar` custom property
        id: sonar-property
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request('GET /repos/{owner}/{repo}/properties/values', {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const property = data.find(p => p.property_name === 'sonar');
            const value = property && property.value ? String(property.value) : '';
            core.info(`sonar custom property: '${value}'`);
            if (!value) {
              core.warning("The 'sonar' custom property is not set on this repository; skipping Sonar. Contact an Admin to enable it.");
            }
            core.setOutput('value', value);

      - name: Configure Sonar host and token from the `sonar` property
        if: ${{ steps.sonar-property.outputs.value != '' }}
        env:
          # The `sonar` property selects the SonarQube instance, e.g. 02 -> https://02.sonarqube.brightspot.tools/
          INSTANCE: ${{ steps.sonar-property.outputs.value }}
          # Fallback: dynamic secret SONAR_TOKEN_<instance>, which only resolves when
          # the caller uses `secrets: inherit`.
          SONAR_TOKEN_DYNAMIC: ${{ secrets[format('SONAR_TOKEN_{0}', steps.sonar-property.outputs.value)] }}
        run: |
          echo "SONAR_HOST_URL=https://${INSTANCE}.sonarqube.brightspot.tools/" >> "$GITHUB_ENV"
          # SONAR_TOKEN may already be set by the "Set Environment Variables" step when
          # the caller passes it through the generic env-var passthrough (e.g.
          # env1Name=SONAR_TOKEN, ENV_1_VALUE=${{ secrets.SONAR_TOKEN_02 }}). Only fall
          # back to the dynamic inherited secret when it wasn't supplied that way.
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN=${SONAR_TOKEN_DYNAMIC}" >> "$GITHUB_ENV"
          fi

      # ───────────────────────────────────────────────────────────────────────────
      # BEGIN: mirror of brightspot-build.yml's build steps.
      # These steps MUST stay identical to the corresponding steps in
      # brightspot-build.yml so a caller that uses BOTH workflows (e.g. golfchannel)
      # produces the SAME Gradle cache keys (compile, bytecode enhancement, tests)
      # and the Sonar build reuses the build job's warm remote cache instead of
      # redoing the work. If you change a build step there, change it here too.
      # The only Sonar-specific deltas below are cache-neutral (they don't change any
      # task's cache key) and are called out inline:
      #   * checkout fetch-depth: 0 — Sonar needs full history for blame/new-code;
      #     build-gradle.sh --unshallow's the build job too, so the computed version
      #     (and thus the keys) still match.
      #   * a second JDK (scanner, 17+) is set up for "Sonar analysis"; the build
      #     itself runs on java-version to match the build job's JDK.
      # ───────────────────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        if: ${{ steps.sonar-property.outputs.value != '' }}
        with:
          lfs: true
          fetch-depth: 0  # Sonar-only: full history for blame / new-code detection

      - name: Validate Gradle wrapper JAR files
        if: ${{ steps.sonar-property.outputs.value != '' }}
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Node
        if: ${{ steps.sonar-property.outputs.value != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # Sonar-only: the scanner requires Java 17+ (sonar-java-version, default 21).
      # The "Sonar analysis" step always runs on this JDK. (brightspot-build.yml sets
      # up a single JDK; here the scan runs on this one and the build on the one below.)
      - name: Set up JDK (Sonar scanner)
        id: setup-scanner-jdk
        if: ${{ steps.sonar-property.outputs.value != '' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.sonar-java-version }}
          distribution: ${{ inputs.java-distribution }}

      # This is the brightspot-build.yml "Set up JDK" equivalent: the build runs on
      # java-version (same as your build workflow, default 11) so compile/enhancement/
      # test cache keys line up. Falls back to the scanner JDK when set to ''.
      - name: Set up JDK (build)
        id: setup-build-jdk
        if: ${{ steps.sonar-property.outputs.value != '' && inputs.java-version != '' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      - name: Setup Gradle
        if: ${{ steps.sonar-property.outputs.value != '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ inputs.gradle-action-cache-disable }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Get Tag Version
        if: ${{ steps.sonar-property.outputs.value != '' }}
        shell: bash
        run: |
          echo "GITHUB_ACTIONS_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          echo "GITHUB_ACTIONS_PULL_REQUEST=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        if: ${{ steps.sonar-property.outputs.value != '' }}
        with:
          repository: perfectsense/brightspot-github-actions-workflows
          ref: v2
          path: ./brightspot

      - name: NPM Cache
        if: ${{ steps.sonar-property.outputs.value != '' && inputs.cache-npm }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.yarn/cache
            ~/.config/yarn/global
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      # END: mirror of brightspot-build.yml's build steps. ───────────────────────

      - name: Cache Sonar packages
        if: ${{ steps.sonar-property.outputs.value != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Determine Sonar project key
        id: project-key
        if: ${{ steps.sonar-property.outputs.value != '' }}
        shell: bash
        run: echo "value=perfectsense:${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"

      # Sonar-only: disable Checkstyle (Sonar reports style itself) so a Checkstyle
      # failure can't fail the build before analysis runs. Applied via an init script
      # that disables any Checkstyle task that exists — a harmless no-op otherwise,
      # and cache-neutral: disabling a task doesn't change the cache keys of the
      # compile/enhancement/test tasks.
      - name: Prepare Checkstyle-disable init script
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/disable-checkstyle.gradle" <<'EOF'
          gradle.taskGraph.whenReady { graph ->
              graph.allTasks
                  .findAll { it.name.toLowerCase().contains('checkstyle') }
                  .each { it.enabled = false }
          }
          EOF

      # Build via the SAME build-gradle.sh the build job uses so the version stamping
      # (PR<n> / tag / git-describe+run) — and therefore the cache keys — are
      # identical, and the build reuses the build job's warm cache (including the
      # already-instrumented test results, so coverage comes from cache). Runs on the
      # build JDK; tests run so Sonar gets coverage. The extra args (`build`, `-i`,
      # the Checkstyle init script) are cache-neutral, so they don't diverge the keys
      # from the build job's `./gradlew` invocation. Publishes a build scan like the
      # build job — handy for inspecting per-task cache hit/miss and where time goes.
      - name: Build with Gradle
        if: ${{ env.SONAR_TOKEN != '' }}
        timeout-minutes: 20
        shell: bash
        env:
          JAVA_HOME: ${{ steps.setup-build-jdk.outputs.path || steps.setup-scanner-jdk.outputs.path }}
          GRADLE_CACHE_USERNAME: ${{ secrets.GRADLE_CACHE_USERNAME }}
          GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}
          # Same params the caller passes to brightspot-build.yml, plus the (cache-
          # neutral) Sonar extras. build-gradle.sh appends the version -P flags.
          GRADLE_PARAMS: ${{ inputs.gradle-params }} build -i --init-script ${{ runner.temp }}/disable-checkstyle.gradle
        run: ./brightspot/brightspot/build-gradle.sh

      # Separate step so the scan time and quality-gate wait are distinct from the
      # build. Reuses the build outputs above (compiled classes, test coverage),
      # which are up to date, so this only runs the analysis.
      # qualitygate.wait makes this wait for (and fail on) the quality gate, up to
      # 20 minutes (qualitygate.timeout is in seconds).
      - name: Sonar analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        timeout-minutes: 20
        env:
          # The scanner requires Java 17+; always run it on the scanner JDK, even
          # when the "Build with Gradle" step above ran on an older java-version.
          JAVA_HOME: ${{ steps.setup-scanner-jdk.outputs.path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRADLE_CACHE_USERNAME: ${{ secrets.GRADLE_CACHE_USERNAME }}
          GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}
        run: |
          ./gradlew sonar -i \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=1200 \
            -Dsonar.projectKey="${{ steps.project-key.outputs.value }}"

      # Render the quality gate result (failed conditions + new-code measures +
      # dashboard link) to the job summary — even when the gate failed above.
      - name: Sonar quality gate summary
        if: ${{ always() && env.SONAR_TOKEN != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          base="${SONAR_HOST_URL%/}"
          report=$(find . -path '*/build/sonar/report-task.txt' 2>/dev/null | head -1)
          if [ -z "$report" ]; then
            printf '## SonarQube Quality Gate\n\n_Summary unavailable (no analysis report found)._\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          key=$(sed -n 's/^projectKey=//p' "$report")
          url=$(sed -n 's/^dashboardUrl=//p' "$report")
          if [ -n "${PR_NUMBER:-}" ]; then scope="&pullRequest=$PR_NUMBER"; label="PR #$PR_NUMBER"; else scope=""; label="$GITHUB_REF_NAME"; fi
          qg=$(curl -s -u "$SONAR_TOKEN:" "$base/api/qualitygates/project_status?projectKey=$key$scope")
          ms=$(curl -s -u "$SONAR_TOKEN:" "$base/api/measures/component?component=$key$scope&metricKeys=new_violations,new_bugs,new_vulnerabilities,new_code_smells,new_security_hotspots,new_coverage,new_duplicated_lines_density")
          status=$(printf '%s' "$qg" | jq -r '.projectStatus.status // "UNKNOWN"')
          case "$status" in OK) badge="✅ Passed" ;; ERROR) badge="❌ Failed" ;; *) badge="⚠️ $status" ;; esac
          LBL='def lbl: {"new_violations":"New issues","new_bugs":"New bugs","new_vulnerabilities":"New vulnerabilities","new_code_smells":"New code smells","new_security_hotspots":"New security hotspots","new_coverage":"Coverage on new code (%)","new_duplicated_lines_density":"Duplications on new code (%)"}[.] // .; def op: {"GT":">","LT":"<","GTE":"≥","LTE":"≤","EQ":"=","NE":"≠"}[.] // .;'
          {
            printf '## SonarQube Quality Gate — %s\n\n' "$badge"
            printf '**Scope:** %s' "$label"
            [ -n "$url" ] && printf ' &nbsp;·&nbsp; [View details on SonarQube](%s)' "$url"
            printf '\n\n'
            fc=$(printf '%s' "$qg" | jq -r "$LBL"'.projectStatus.conditions[]? | select(.status=="ERROR") | "| \(.metricKey|lbl) | \(.actualValue) | \(.comparator|op) \(.errorThreshold) |"')
            if [ -n "$fc" ]; then
              printf '**Failed conditions:**\n\n| Condition | Actual | Required |\n| --- | --- | --- |\n%s\n\n' "$fc"
            fi
            printf '**New-code measures:**\n\n| Metric | Value |\n| --- | --- |\n'
            printf '%s' "$ms" | jq -r "$LBL"'(.component.measures // []) | sort_by(.metric)[] | "| \(.metric|lbl) | \((.period.value // .value)) |"'
          } >> "$GITHUB_STEP_SUMMARY"
