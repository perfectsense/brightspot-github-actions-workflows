name: AI Review

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review the PR using Anthropic Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools 'mcp__github_ci__download_job_log,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_comment__update_claude_comment'
          use_sticky_comment: true
          prompt: |
            Review this pull request thoroughly and provide concise, specific feedback, focusing on the following:
            
            - Overall architecture and design decisions
            - Potential bugs or security issues
            - Suggestions for improvements
            - Code quality and best practices
            - Performance considerations
            - Maintenance and readability
            - Documentation consistency
