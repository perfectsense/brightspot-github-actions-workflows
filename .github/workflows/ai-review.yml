name: AI Review

on:
  workflow_call:
    inputs:
      jira-project:
        description: 'Jira project key override (e.g. BSP). If omitted, detected from repo Autolink settings.'
        required: false
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      JIRA_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  config:
    runs-on: ubuntu-22.04
    outputs:
      tool: ${{ steps.read.outputs.tool }}
    steps:
      - name: Read ai-review custom property
        id: read
        run: |
          RAW=$(gh api repos/${{ github.repository }}/properties/values \
            --jq '.[] | select(.property_name == "ai-review") | .value' \
            2>/dev/null || echo "")
          case "$RAW" in
            claude|copilot)
              TOOL="$RAW"
              ;;
            "")
              TOOL=""
              echo "::warning title=AI Review not configured::No AI review has been configured for this repository. Set the 'ai-review' custom property to 'claude' or 'copilot', or contact your GitHub admin."
              ;;
            *)
              TOOL=""
              echo "::warning title=AI Review not configured::Unrecognized 'ai-review' custom property value: '${RAW}'. Expected 'claude' or 'copilot'. Contact your GitHub admin."
              ;;
          esac
          echo "tool=${TOOL}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  claude:
    needs: config
    if: needs.config.outputs.tool == 'claude'
    uses: ./.github/workflows/ai-review-claude.yml
    with:
      jira-project: ${{ inputs.jira-project }}
    secrets: inherit

  copilot:
    needs: config
    if: needs.config.outputs.tool == 'copilot'
    uses: ./.github/workflows/ai-review-copilot.yml
    secrets: inherit
