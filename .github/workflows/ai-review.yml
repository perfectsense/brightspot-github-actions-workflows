name: AI Review

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review the PR using Anthropic Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools 'mcp__github__create_pending_pull_request_review,mcp__github__get_pull_request_diff,mcp__github__add_comment_to_pending_review,mcp__github__submit_pending_pull_request_review'
          use_sticky_comment: true
          prompt: |
            Review this pull request thoroughly and provide concise, specific feedback, focusing on the following:
            
            - Overall architecture and design decisions
            - Potential bugs or security issues
            - Suggestions for improvements
            - Code quality and best practices
            - Performance considerations
            - Maintenance and readability
            - Documentation consistency
