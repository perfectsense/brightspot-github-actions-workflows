name: AI Review

on:
  workflow_call:

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review the PR using Anthropic Claude Code
        uses: anthropics/claude-code-action@v1-dev
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request comprehensively.
            
            Focus on:
            - Overall architecture and design decisions
            - Potential bugs or security issues
            - Suggestions for improvements
            - Code quality and best practices
            - Performance considerations
            - Maintenance and readability
            - Documentation consistency
            
            Be constructive and provide specific suggestions for improvements.
            Use GitHub's suggestion format when proposing code changes.
