name: AI Review

on:
  workflow_call:
    inputs:
      jira-project:
        description: 'Jira project key override (e.g. BSP). If omitted, detected from repo Autolink settings.'
        required: false
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      JIRA_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Detect Jira project from Autolink settings
        id: autolink
        run: |
          DETECTED=$(gh api repos/${{ github.repository }}/autolinks \
            --jq '[.[].key_prefix | select(test("^[A-Z]+-$"))] | first // ""' \
            | sed 's/-$//')
          OVERRIDE="${{ inputs.jira-project }}"
          PROJECT="${OVERRIDE:-${DETECTED:-BSP}}"
          echo "jira-project=${PROJECT}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch the Jira work item
        id: jira
        uses: perfectsense/.github/jira-context@main
        with:
          project: ${{ steps.autolink.outputs.jira-project }}
          email: ${{ secrets.JIRA_EMAIL }}
          api-token: ${{ secrets.JIRA_API_TOKEN }}
          text: ${{ github.event.pull_request.title }}

      - name: Review the code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Backward compatibility — always call out breaking changes to APIs, data formats, or behavior that could affect existing consumers
            - Potential bugs, logic errors, or incorrect behavior
            - Security implications
            - Performance considerations

            When reviewing:
            - Note: The PR branch is already checked out in the current working directory
            - Follow the project conventions defined in CLAUDE.md and the .ai/ guides
            - Focus only on the PR diff using `gh pr diff` to see the changes — do not comment on pre-existing issues outside the change
            - Only comment on substantive issues — skip minor style nits. Limit to the most important findings
            - Check existing PR comments before posting to avoid duplicates on re-reviews

            When commenting:
            - Use `gh pr comment` for top-level feedback
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues
            - Only post GitHub comments - don't submit review text as messages

            Use the following context from Jira to evaluate whether the PR fulfills the requirements:
            ${{ steps.jira.outputs.context }}

          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Grep,mcp__github_inline_comment__create_inline_comment,Read"

  respond:
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event_name == 'pull_request_review_comment' || (github.event_name == 'issue_comment' && github.event.issue.pull_request))
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Grep,mcp__github_inline_comment__create_inline_comment,Read"
