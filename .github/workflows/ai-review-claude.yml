name: AI Review (Claude)

# Reusable Claude PR-review workflow. Call it from another repository:
#
#     name: AI Review (Claude)
#
#     on:
#       pull_request:
#         types: [opened, synchronize, reopened, ready_for_review]
#
#     permissions:
#       contents: read
#       pull-requests: write
#       id-token: write
#
#     jobs:
#       review:
#         uses: perfectsense/brightspot-github-actions-workflows/.github/workflows/ai-review-claude.yml@v1
#         secrets: inherit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      JIRA_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Jira context is optional: when the Jira secrets are unavailable, the
      # review still runs — it just can't evaluate the PR against the work item.
      - name: Fetch the Jira work item
        id: jira
        uses: actions/github-script@v9
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            core.setOutput('context', '');

            const email = process.env.JIRA_EMAIL;
            const apiToken = process.env.JIRA_API_TOKEN;

            if (!email || !apiToken) {
              core.notice('Jira credentials are not configured; reviewing without Jira context.');
              return;
            }

            // Detect the Jira project from the repo's Autolink settings,
            // defaulting to BSP when none is configured.
            let prefix = 'BSP-';
            try {
              const { data: autolinks } = await github.rest.repos.listAutolinks(context.repo);
              const detected = autolinks.map(a => a.key_prefix).find(p => /^[A-Z]+-$/.test(p));
              if (detected) prefix = detected;
            } catch (error) {
              core.warning(`Could not read Autolink settings: ${error.message}`);
            }

            const pattern = new RegExp(`${prefix}\\d+`, 'g');
            const keys = [...new Set([...(process.env.PR_TITLE || '').matchAll(pattern)].map(m => m[0]))];
            if (keys.length === 0) {
              return;
            }

            const auth = Buffer.from(`${email}:${apiToken}`).toString('base64');
            const results = [];

            for (const key of keys) {
              const response = await fetch(
                `https://perfectsense.atlassian.net/rest/api/3/issue/${key}?fields=summary,description,status,comment`,
                { headers: { 'Authorization': `Basic ${auth}`, 'Accept': 'application/json' } }
              );

              if (!response.ok) {
                core.warning(`Failed to fetch Jira work item ${key}: ${response.status} ${response.statusText}`);
                continue;
              }

              const { fields } = await response.json();
              results.push({
                key,
                summary: fields.summary,
                description: fields.description,
                status: fields.status?.name,
                comments: (fields.comment?.comments || []).map(c => ({
                  author: c.author?.displayName,
                  body: c.body,
                  created: c.created
                }))
              });
            }

            if (results.length > 0) {
              core.setOutput(
                'context',
                'Use the following context from Jira to evaluate whether the PR fulfills the requirements:\n'
                  + JSON.stringify(results)
              );
            }

      - name: Review the code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Potential bugs, logic errors, or incorrect behavior
            - Security implications
            - Performance considerations

            When reviewing:
            - Note: The PR branch is already checked out in the current working directory
            - Follow the project conventions defined in CLAUDE.md and the .ai/ guides
            - Focus only on the PR diff using `gh pr diff` to see the changes — do not comment on pre-existing issues outside the change
            - Only comment on substantive issues — skip minor style nits. Limit to the most important findings
            - The existing PR comments and prior review threads should already be in your context for this run — treat that conversation as the authoritative history of what has already been discussed (use `gh pr view --comments` to re-check if needed)
            - If a finding — yours or another reviewer's — has already been raised on this PR and a maintainer has replied to it, do NOT post it again. Do not rephrase it, escalate its severity, re-open it, or split it into a "new" finding on a later push. State a given concern at most ONCE across the life of the PR, then move on
            - You may disagree with a maintainer's reply, but make that case only once in the existing thread — never repeat the same point on subsequent runs
            - The only exception: the code at that location has materially changed since the maintainer replied. In that case you may comment on the changed code, referencing the prior discussion

            When commenting:
            - Use `gh pr comment` for top-level feedback
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues
            - Only post GitHub comments - don't submit review text as messages

            ${{ steps.jira.outputs.context }}
            
            After posting any inline comments or top-level feedback:
            - If you found any feedback requiring action — including minor style issues, not just blocking bugs — submit a blocking review:
                gh pr review ${{ github.event.pull_request.number }} --request-changes --body "Claude found issues that should be addressed before merging. See inline comments for details."
            - If you only have informational notes with no required actions, or the PR looks good, submit a neutral review:
                gh pr review ${{ github.event.pull_request.number }} --comment --body "Claude review complete. No required changes."
            - Do not submit both — pick one verdict based on whether any comment requires action.
          claude_args: |
            --model claude-sonnet-4-6 --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Grep,mcp__github_inline_comment__create_inline_comment,Read"

      - name: Reconcile Claude review verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Claude posts reviews as claude[bot] when the Claude GitHub App is
          # installed, otherwise as github-actions[bot]. Match either.
          REVIEWS=$(gh api repos/$REPO/pulls/$PR/reviews --paginate \
            --jq '[.[] | select(.user.login == "claude[bot]" or .user.login == "github-actions[bot]")]')

          # Verdict reviews carry a body; the inline-comment reviews are bodyless.
          LATEST_VERDICT=$(echo "$REVIEWS" \
            | jq -r '[.[] | select(.body != null and .body != "")] | last | .state // ""')
          echo "Latest Claude verdict: ${LATEST_VERDICT:-<none>}"

          if [ "$LATEST_VERDICT" = "CHANGES_REQUESTED" ]; then
            echo "Claude requested changes — failing the status check"
            exit 1
          fi

          # No required changes: dismiss any still-open change-request reviews so
          # they stop blocking the merge. A neutral --comment review does NOT
          # supersede a prior --request-changes on its own.
          STALE=$(echo "$REVIEWS" | jq -r '.[] | select(.state == "CHANGES_REQUESTED") | .id')
          for ID in $STALE; do
            echo "Dismissing stale Claude change-request review $ID"
            gh api -X PUT repos/$REPO/pulls/$PR/reviews/$ID/dismissals \
              -f message="Superseded by Claude's latest review: no required changes." \
              -f event="DISMISS"
          done
          
