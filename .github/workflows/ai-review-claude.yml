name: AI Review (Claude)

on:
  push:
    branches:
      - develop
      - release/*
    tags: v*

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - release/*

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Detect Jira project from Autolink settings
        id: autolink
        run: |
          DETECTED=$(gh api repos/${{ github.repository }}/autolinks \
            --jq '[.[].key_prefix | select(test("^[A-Z]+-$"))] | first // ""' \
            | sed 's/-$//')
          echo "jira-project=${DETECTED:-BSP}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch the Jira work item
        id: jira
        uses: perfectsense/.github/jira-context@main
        with:
          project: ${{ steps.autolink.outputs.jira-project }}
          email: ${{ secrets.JIRA_EMAIL }}
          api-token: ${{ secrets.JIRA_API_TOKEN }}
          text: ${{ github.event.pull_request.title }}

      - name: Review the code
        uses: anthropics/claude-code-action@v1
        with:
          model: 'claude-sonnet-4-6'
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Potential bugs, logic errors, or incorrect behavior
            - Security implications
            - Performance considerations

            When reviewing:
            - Note: The PR branch is already checked out in the current working directory
            - Follow the project conventions defined in CLAUDE.md and the .ai/ guides
            - Focus only on the PR diff using `gh pr diff` to see the changes — do not comment on pre-existing issues outside the change
            - Only comment on substantive issues — skip minor style nits. Limit to the most important findings
            - Check existing PR comments before posting to avoid duplicates on re-reviews

            When commenting:
            - Use `gh pr comment` for top-level feedback
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues
            - Only post GitHub comments - don't submit review text as messages

            Use the following context from Jira to evaluate whether the PR fulfills the requirements:
            ${{ steps.jira.outputs.context }}
            
            After posting any inline comments or top-level feedback:
            - If you found any feedback requiring action — including minor style issues, not just blocking bugs — submit a blocking review:
                gh pr review ${{ github.event.pull_request.number }} --request-changes --body "Claude found issues that should be addressed before merging. See inline comments for details."
            - If you only have informational notes with no required actions, or the PR looks good, submit a neutral review:
                gh pr review ${{ github.event.pull_request.number }} --comment --body "Claude review complete. No required changes."
            - Do not submit both — pick one verdict based on whether any comment requires action.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Grep,mcp__github_inline_comment__create_inline_comment,Read"

      - name: Fail check if Claude requested changes
        if: always()
        run: |
          VERDICT=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .state')
          echo "Claude verdict: $VERDICT"
          if [ "$VERDICT" = "CHANGES_REQUESTED" ]; then
            echo "Claude requested changes — failing the status check"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          
