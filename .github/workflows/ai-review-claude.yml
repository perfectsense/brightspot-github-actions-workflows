name: AI Review (Claude)

# Reusable Claude PR-review workflow. Call it from another repository:
#
#     name: AI Review (Claude)
#
#     on:
#       pull_request:
#         types: [opened, synchronize, reopened, ready_for_review]
#
#     permissions:
#       contents: read
#       pull-requests: write
#       id-token: write
#
#     jobs:
#       review:
#         uses: perfectsense/brightspot-github-actions-workflows/.github/workflows/ai-review-claude.yml@v1
#         secrets: inherit
#
# The review runs on Amazon Bedrock, authenticating with the org-level
# AWS_BEDROCK_ROLE_TO_ASSUME secret over OIDC. When that secret is not available
# — any repository outside the organization that owns it — the review falls back
# to the Anthropic API and ANTHROPIC_API_KEY. The provider, model and region are
# fixed by this workflow; callers cannot override them.
#
# When the organization variable AI_REVIEW_USAGE_LOG_GROUP names a CloudWatch log
# group, a Bedrock run also publishes its total_cost_usd there, tagged with the
# same attribution the request metadata carries, so Log Insights can report spend
# per repository, PR or job. The OIDC role needs logs:CreateLogStream and
# logs:PutLogEvents on that group. `vars` resolves against the calling repository,
# so an organization-level variable covers every caller inside the organization
# and leaves the rest reporting nothing.
#
# When this workflow is started directly by the organization RuleSet (rather than
# through `workflow_call`) and the target repository ships its own
# `.github/workflows/ai-review.yml` or `.github/workflows/ai-review-claude.yml`,
# the review is skipped so the two runs don't duplicate each other.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_call:
    inputs:
      # Internal marker — do not set this from a caller. The `inputs` context is
      # empty for the `pull_request` trigger, so this defaulting to true is what
      # tells a project's own `uses:` invocation apart from a run started
      # directly by the organization RuleSet.
      invoked_by_project:
        description: 'Reserved for internal use.'
        type: boolean
        required: false
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        # Only needed when the review resolves to the Anthropic API.
        required: false
      AWS_BEDROCK_ROLE_TO_ASSUME:
        # OIDC role granting bedrock:InvokeModel*. An org-level secret, so a
        # caller inside the owning organization using `secrets: inherit` needs no
        # repo-level setup.
        required: false
      JIRA_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # A project that ships its own review workflow already runs the review on
      # its own terms; the RuleSet-invoked copy stands down so the PR isn't
      # reviewed twice. Only relevant for a direct trigger — a project calling
      # this workflow itself is always honored.
      #
      # The second condition keeps this repository reviewing its own PRs: on a
      # direct trigger `github.workflow_ref` is the triggered workflow's own
      # path, so it starts with `github.repository` only when the checkout being
      # reviewed is the repository that hosts this file. Without it, the
      # ai-review-claude.yml below would match itself and self-review would stop.
      - name: Check for a project-managed AI review
        id: project_review
        if: |
          inputs.invoked_by_project != true &&
          !startsWith(github.workflow_ref, format('{0}/', github.repository))
        run: |
          for FILE in .github/workflows/ai-review.yml .github/workflows/ai-review.yaml \
                      .github/workflows/ai-review-claude.yml .github/workflows/ai-review-claude.yaml; do
            [ -f "$FILE" ] || continue

            MESSAGE="The AI Review is managed within the project ($FILE), please contact support to disable the RuleSet invoked version of your Claude Review."
            echo "::notice title=AI Review skipped::$MESSAGE"
            printf '### AI Review skipped\n\n%s\n' "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          done

          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Jira context is optional: when the Jira secrets are unavailable, the
      # review still runs — it just can't evaluate the PR against the work item.
      - name: Fetch the Jira work item
        id: jira
        if: steps.project_review.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            core.setOutput('context', '');

            const email = process.env.JIRA_EMAIL;
            const apiToken = process.env.JIRA_API_TOKEN;

            if (!email || !apiToken) {
              core.notice('Jira credentials are not configured; reviewing without Jira context.');
              return;
            }

            // Detect the Jira project from the repo's Autolink settings,
            // defaulting to BSP when none is configured.
            let prefix = 'BSP-';
            try {
              const { data: autolinks } = await github.rest.repos.listAutolinks(context.repo);
              const detected = autolinks.map(a => a.key_prefix).find(p => /^[A-Z]+-$/.test(p));
              if (detected) prefix = detected;
            } catch (error) {
              core.warning(`Could not read Autolink settings: ${error.message}`);
            }

            const pattern = new RegExp(`${prefix}\\d+`, 'g');
            const keys = [...new Set([...(process.env.PR_TITLE || '').matchAll(pattern)].map(m => m[0]))];
            if (keys.length === 0) {
              return;
            }

            const auth = Buffer.from(`${email}:${apiToken}`).toString('base64');
            const results = [];

            for (const key of keys) {
              const response = await fetch(
                `https://perfectsense.atlassian.net/rest/api/3/issue/${key}?fields=summary,description,status,comment`,
                { headers: { 'Authorization': `Basic ${auth}`, 'Accept': 'application/json' } }
              );

              if (!response.ok) {
                core.warning(`Failed to fetch Jira work item ${key}: ${response.status} ${response.statusText}`);
                continue;
              }

              const { fields } = await response.json();
              results.push({
                key,
                summary: fields.summary,
                description: fields.description,
                status: fields.status?.name,
                comments: (fields.comment?.comments || []).map(c => ({
                  author: c.author?.displayName,
                  body: c.body,
                  created: c.created
                }))
              });
            }

            if (results.length > 0) {
              core.setOutput(
                'context',
                'Use the following context from Jira to evaluate whether the PR fulfills the requirements:\n'
                  + JSON.stringify(results)
              );
            }

      # Bedrock is used wherever it is actually configured: this workflow is
      # public and called from repositories outside the organization that holds
      # the OIDC role, which have no way to assume it. Falling back on the
      # secret's absence keeps those callers on the API key instead of failing
      # them at the auth step.
      - name: Resolve the provider
        id: provider
        if: steps.project_review.outputs.skip != 'true'
        env:
          MODEL: claude-sonnet-4-6
          ROLE: ${{ secrets.AWS_BEDROCK_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail

          if [ -z "$ROLE" ]; then
            echo "Provider: Anthropic API"
            echo "provider=api" >> "$GITHUB_OUTPUT"
            echo "model=$MODEL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bedrock serves Claude through cross-region inference profiles, whose
          # ID carries a geography prefix — `us.` for the pinned us-east-1 region.
          # Claude Code uses the Invoke API, so the ID must be the profile form
          # (us.anthropic.<model>); the Mantle form (anthropic.<model>) returns
          # 400 there.
          echo "Provider: Amazon Bedrock (us.anthropic.$MODEL)"
          echo "provider=bedrock" >> "$GITHUB_OUTPUT"
          echo "model=us.anthropic.$MODEL" >> "$GITHUB_OUTPUT"

      # Both outputs attribute Bedrock usage to the calling repo. The session name
      # is what tells repos apart in `identity.arn` in the model invocation logs,
      # since every repo assumes the same org-level role; the header tags each call
      # directly. Bedrock records the tags only where invocation logging is enabled
      # — without it the call still succeeds untagged.
      #
      # Session names cap at 64 characters and reject `/`, so this is the repo name
      # alone, truncated from the tail — the distinctive end. The length guard is
      # required: bash returns empty, not the whole string, when a negative
      # substring offset exceeds the string's length.
      - name: Build the Bedrock attribution
        id: usage
        if: steps.provider.outputs.provider == 'bedrock'
        env:
          REPO: ${{ github.repository }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ "${#NAME}" -le 54 ] || NAME="${NAME: -54}"
          printf 'session=ai-review-%s\n' "$NAME" >> "$GITHUB_OUTPUT"
          printf 'header=X-Amzn-Bedrock-Request-Metadata: {"repo": "%s", "workflow": "ai-review", "job": "review", "pr": "%s"}\n' \
            "$REPO" "$PR" >> "$GITHUB_OUTPUT"

      # Bedrock authenticates by OIDC only — there is no API-key path.
      - name: Configure AWS credentials
        if: steps.provider.outputs.provider == 'bedrock'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_TO_ASSUME }}
          role-session-name: ${{ steps.usage.outputs.session }}
          aws-region: us-east-1
          retry-max-attempts: 3

      - name: Review the code
        id: review
        if: steps.project_review.outputs.skip != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_CUSTOM_HEADERS: ${{ steps.usage.outputs.header }}
        with:
          anthropic_api_key: ${{ steps.provider.outputs.provider == 'bedrock' && '' || secrets.ANTHROPIC_API_KEY }}
          use_bedrock: ${{ steps.provider.outputs.provider == 'bedrock' }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Potential bugs, logic errors, or incorrect behavior
            - Security implications
            - Performance considerations

            When reviewing:
            - Note: The PR branch is already checked out in the current working directory
            - Follow the project conventions defined in CLAUDE.md and the .ai/ guides
            - Focus only on the PR diff using `gh pr diff` to see the changes — do not comment on pre-existing issues outside the change
            - Only comment on substantive issues — skip minor style nits. Limit to the most important findings
            - The existing PR comments and prior review threads should already be in your context for this run — treat that conversation as the authoritative history of what has already been discussed (use `gh pr view --comments` to re-check if needed)
            - If a finding — yours or another reviewer's — has already been raised on this PR and a maintainer has replied to it, do NOT post it again. Do not rephrase it, escalate its severity, re-open it, or split it into a "new" finding on a later push. State a given concern at most ONCE across the life of the PR, then move on
            - You may disagree with a maintainer's reply, but make that case only once in the existing thread — never repeat the same point on subsequent runs
            - The only exception: the code at that location has materially changed since the maintainer replied. In that case you may comment on the changed code, referencing the prior discussion

            When commenting:
            - Use `gh pr comment` for top-level feedback
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues
            - Only post GitHub comments - don't submit review text as messages

            ${{ steps.jira.outputs.context }}
            
            After posting any inline comments or top-level feedback, submit exactly one review.
            This review is advisory: never use --request-changes or --approve. A change-request
            verdict holds the merge through the organization RuleSet's pull_request rule even
            when every status check is green, so findings belong in the comments, not the gate.
            - If you found feedback requiring action — including minor style issues, not just blocking bugs:
                gh pr review ${{ github.event.pull_request.number }} --comment --body "Claude found issues worth addressing before merging. See inline comments for details. This review is advisory and does not block the merge."
            - If you only have informational notes with no required actions, or the PR looks good:
                gh pr review ${{ github.event.pull_request.number }} --comment --body "Claude review complete. No required changes."
            - Do not submit both — pick one body based on whether any comment requires action.
          claude_args: |
            --model ${{ steps.provider.outputs.model }} --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Grep,mcp__github_inline_comment__create_inline_comment,Read"

      - name: Clear blocking Claude reviews
        if: always() && steps.project_review.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Claude posts reviews as claude[bot] when the Claude GitHub App is
          # installed, otherwise as github-actions[bot]. Match either.
          REVIEWS=$(gh api repos/$REPO/pulls/$PR/reviews --paginate \
            --jq '[.[] | select(.user.login == "claude[bot]" or .user.login == "github-actions[bot]")]')

          # Verdict reviews carry a body; the inline-comment reviews are bodyless.
          LATEST_VERDICT=$(echo "$REVIEWS" \
            | jq -r '[.[] | select(.body != null and .body != "")] | last | .state // ""')
          echo "Latest Claude verdict: ${LATEST_VERDICT:-<none>}"

          # The review is advisory, so this step never fails the check. Dismiss any
          # change-request review instead: a neutral --comment review does NOT
          # supersede a prior --request-changes on its own, and while one stands the
          # organization RuleSet's pull_request rule holds the merge. Reaching here
          # means the verdict was left over from before the review went advisory, or
          # Claude ignored the prompt — dismiss it either way.
          STALE=$(echo "$REVIEWS" | jq -r '.[] | select(.state == "CHANGES_REQUESTED") | .id')
          for ID in $STALE; do
            echo "Dismissing blocking Claude review $ID"
            gh api -X PUT repos/$REPO/pulls/$PR/reviews/$ID/dismissals \
              -f message="The Claude review is advisory and does not block merging. See the inline comments for any findings." \
              -f event="DISMISS"
          done

      # `total_cost_usd` is only known once the run has finished, so unlike the
      # rest of the attribution it cannot ride along on the Bedrock request
      # metadata. Publishing it as a companion CloudWatch record carrying the
      # same fields lets a Log Insights query report spend per repo, PR or job
      # alongside the model invocation logs.
      #
      # Gated on the log group being configured — a repository outside the
      # organization has nothing to write to — and on Bedrock, the only path
      # holding AWS credentials. The role needs logs:CreateLogStream and
      # logs:PutLogEvents on the group; without them the cost is dropped with a
      # warning rather than failing the job.
      - name: Publish the review cost
        if: always() && steps.provider.outputs.provider == 'bedrock' && vars.AI_REVIEW_USAGE_LOG_GROUP != ''
        continue-on-error: true
        env:
          LOG_GROUP: ${{ vars.AI_REVIEW_USAGE_LOG_GROUP }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          SESSION: ${{ steps.review.outputs.session_id }}
          MODEL: ${{ steps.provider.outputs.model }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution output; nothing to publish."
            exit 0
          fi

          # The execution file holds the run's message array, whose trailing
          # result message carries the totals. `empty` covers a run that ended
          # without one — a crash or a cancellation — leaving nothing to report.
          EVENT=$(jq -c \
            --arg repo "$REPO" \
            --arg pr "$PR" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg model "$MODEL" \
            --arg session_id "$SESSION" \
            '[.[] | select(.type == "result" and .total_cost_usd != null)] | last // empty
               | { workflow: "ai-review", job: "review", $repo, $pr, $run_id, $run_attempt,
                   $model, $session_id, total_cost_usd, duration_ms, num_turns,
                   is_error, subtype, usage }
               | with_entries(select(.value != null and .value != ""))' \
            "$EXECUTION_FILE")

          if [ -z "$EVENT" ]; then
            echo "The run reported no cost."
            exit 0
          fi

          echo "$EVENT"

          # A stream per run attempt keeps concurrent reviews from interleaving.
          STREAM="review/$REPO/$RUN_ID-$RUN_ATTEMPT"
          aws logs create-log-stream \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$STREAM" 2>/dev/null || true

          EVENTS=$(jq -cn --argjson ts "$(( $(date +%s) * 1000 ))" --arg message "$EVENT" \
            '[{ timestamp: $ts, message: $message }]')

          if ! OUTPUT=$(aws logs put-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$STREAM" \
            --log-events "$EVENTS" 2>&1); then
            echo "::warning title=AI Review cost not published::$OUTPUT"
          fi
