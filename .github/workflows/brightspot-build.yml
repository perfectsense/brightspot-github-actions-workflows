name: 'Brightspot Build'

on:
  workflow_call:
    inputs:
      build-maven:
        description: 'Build with Maven'
        default: false
        type: boolean

      build-gradle:
        description: 'Build with Gradle'
        default: true
        type: boolean

      gradle-params:
        description: 'Extra parameters to pass to Gradle command'
        required: false
        type: string

      gradle-action-cache-disable:
        description: 'Set to true to disable the Gradle Action cache (defaults to enabled).'
        required: false
        default: false
        type: boolean

      java-distribution:
        description: 'Java distribution'
        required: false
        default: 'temurin'
        type: string

      java-version:
        description: 'Java version'
        required: false
        default: '11'
        type: string

      node-version:
        description: 'Node version'
        required: false
        default: '16.11.0'
        type: string

      cache-npm:
        description: 'Cache NPM'
        default: true
        type: boolean

      war-build-dir:
        description: 'Directory containing the compiled WAR file. This overrides the default which is web/build/libs'
        required: false
        default: 'web/build/libs'
        type: string

      runs-on:
        description: Platform to execute on
        type: string
        default: ubuntu-22.04-4core

      env1Name:
        description: Name for environment variable #1 (value is passed via secrets)
        type: string
      env2Name:
        description: Name for environment variable #2 (value is passed via secrets)
        type: string
      env3Name:
        description: Name for environment variable #3 (value is passed via secrets)
        type: string

    secrets:
      ENV_1_VALUE:
        required: false
      ENV_2_VALUE:
        required: false
      ENV_3_VALUE:
        required: false
      GRADLE_CACHE_USERNAME:
        required: false
      GRADLE_CACHE_PASSWORD:
        required: false

jobs:
  build:
    name: "Build"
    runs-on: ${{ inputs.runs-on }}
    # Map the job outputs to step outputs
    outputs:
      container-build-tag: ${{ steps.build-container.outputs.container-build-tag }}
      container-version-tag: ${{ steps.build-container.outputs.container-version-tag }}
    steps:
      - name: Set Environment Variables
        run: |
          if [ -n "${{ inputs.env1Name }}" ]; then
            echo "${{ inputs.env1Name }}=${{ secrets.ENV_1_VALUE }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.env2Name }}" ]; then
            echo "${{ inputs.env2Name }}=${{ secrets.ENV_2_VALUE }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.env3Name }}" ]; then
            echo "${{ inputs.env3Name }}=${{ secrets.ENV_3_VALUE }}" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4
        with:
            lfs: true

        # must run before gradle/gradle-build-action
      - name: Validate Gradle wrapper JAR files
        if: ${{ inputs.build-gradle }}
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: ${{ inputs.node-version }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      # On self-hosted runners, caches go to S3 in-region under credentials
      # scoped to this repository. Requires the caller to grant
      # `permissions: id-token: write`; otherwise this is a no-op and the cache
      # steps below use GitHub's cache.
      - uses: perfectsense/.github/cache-credentials@main

      - name: Setup Gradle
        if: ${{ inputs.build-gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          # The Gradle action can only cache through GitHub's backend, so on
          # self-hosted runners the explicit step below caches Gradle home instead.
          cache-disabled: ${{ inputs.gradle-action-cache-disable || runner.environment == 'self-hosted' }}

      - name: Gradle Cache
        if: ${{ inputs.build-gradle && !inputs.gradle-action-cache-disable && runner.environment == 'self-hosted' }}
        uses: runs-on/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/*/plugin-resolution
            !~/.gradle/caches/build-cache-1
            !~/.gradle/caches/journal-1
            !~/.gradle/caches/**/*.lock
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      - name: Get Tag Version
        shell: bash
        run: |
          echo "GITHUB_ACTIONS_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          echo "GITHUB_ACTIONS_PULL_REQUEST=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: perfectsense/brightspot-github-actions-workflows
          ref: v2
          path: ./brightspot

      # runs-on/cache is a drop-in for actions/cache that stores in S3 when the
      # cache-credentials step above enabled it, and in GitHub's cache otherwise.
      - name: Maven Cache
        if: ${{ inputs.build-maven }}
        uses: runs-on/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-

      - name: NPM Cache
        if: ${{ inputs.cache-npm}}
        uses: runs-on/cache@v5
        with:
          # ~/.cache/yarn is Yarn 1's cache; ~/.yarn/cache is Yarn Berry's.
          path: |
            ~/.npm
            ~/.cache/yarn
            ~/.yarn/cache
            ~/.config/yarn/global
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-

      - name: Build with Maven
        if: ${{ inputs.build-maven }}
        shell: bash
        run: ./brightspot/brightspot/build-maven.sh

      - name: Build with Gradle
        if: ${{ inputs.build-gradle }}
        shell: bash
        env:
          GRADLE_CACHE_USERNAME: ${{ secrets.GRADLE_CACHE_USERNAME }}
          GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}
          GRADLE_PARAMS: ${{ inputs.gradle-params }}
        run: ./brightspot/brightspot/build-gradle.sh

      - name: Publish JUnit test reports
        uses: mikepenz/action-junit-report@v5
        if: ${{ inputs.build-gradle && !cancelled() }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Store Build
        if: ${{ inputs.build-gradle || inputs.build-maven }}
        uses: actions/upload-artifact@v4
        with:
            name: brightspot-build
            path: ${{ inputs.war-build-dir }}
            retention-days: 2

      - name: Find Brightspot Version
        if: ${{ inputs.build-gradle || inputs.build-maven }}
        run: ./brightspot/analysis/brightspot-version.sh > brightspot-version.txt
        shell: bash

      - name: Store Brightspot Version
        if: ${{ inputs.build-gradle || inputs.build-maven }}
        uses: actions/upload-artifact@v4
        with:
            name: brightspot-version
            path: brightspot-version.txt
            retention-days: 2
