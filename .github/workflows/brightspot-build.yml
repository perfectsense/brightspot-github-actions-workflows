name: 'Brightspot Build'

on:
  workflow_call:
    inputs:
      build-maven:
        description: 'Build with Maven'
        default: false
        type: boolean

      build-gradle:
        description: 'Build with Gradle'
        default: true
        type: boolean

      gradle-params:
        description: 'Extra parameters to pass to Gradle command'
        required: false
        type: string

      gradle-action-cache-disable:
        description: 'Enable only if not using Gradle Remote Cache'
        required: false
        default: true
        type: boolean

      java-distribution:
        description: 'Java distribution'
        required: false
        default: 'temurin'
        type: string

      java-version:
        description: 'Java version'
        required: false
        default: '21'
        type: string

      node-version:
        description: 'Node version'
        required: false
        default: '18.17.1'
        type: string

      cache-npm:
        description: 'Cache NPM'
        default: true
        type: boolean

      war-build-dir:
        description: 'Directory containing the compiled WAR file. This overrides the default which is web/build/libs'
        required: false
        default: 'web/build/libs'
        type: string

      runs-on:
        description: Platform to execute on
        type: string
        default: ubuntu-22.04-4core

      sonar:
        description: >-
          How to run Sonar analysis: "job" (separate job on the Sonar runner pool,
          default), "inline" (a step in the build job, reusing the build's compiled
          classes and test/coverage — requires java-version 17+), or "disabled".
        required: false
        default: 'job'
        type: string

      deploy:
        description: >-
          Where to deploy after the build: "aws", "gcp", or "none" (default). The
          deploy runs as a job in parallel with Sonar (both only need `build`), so
          Sonar never blocks or delays it.
        required: false
        default: 'none'
        type: string

      deploy-project:
        description: 'Deploy: project shortname (passed to the cloud deploy as `project`).'
        required: false
        default: ''
        type: string

      deploy-repository:
        description: 'Deploy: repository name (passed as `repository`; the deploy fills in a default when empty).'
        required: false
        default: ''
        type: string

      deploy-region:
        description: 'Deploy (AWS only): region to deploy to (passed as `region`).'
        required: false
        default: ''
        type: string

      deploy-registry:
        description: 'Deploy (GCP only): registry to push the image to (passed as `registry`).'
        required: false
        default: ''
        type: string

      env1Name:
        description: Name for environment variable #1 (value is passed via secrets)
        type: string
      env2Name:
        description: Name for environment variable #2 (value is passed via secrets)
        type: string
      env3Name:
        description: Name for environment variable #3 (value is passed via secrets)
        type: string

    secrets:
      ENV_1_VALUE:
        required: false
      ENV_2_VALUE:
        required: false
      ENV_3_VALUE:
        required: false
      GRADLE_CACHE_USERNAME:
        required: false
      GRADLE_CACHE_PASSWORD:
        required: false

jobs:
  build:
    name: "Build"
    runs-on: ${{ inputs.runs-on }}
    # Map the job outputs to step outputs
    outputs:
      container-build-tag: ${{ steps.build-container.outputs.container-build-tag }}
      container-version-tag: ${{ steps.build-container.outputs.container-version-tag }}
    steps:
      - name: Set Environment Variables
        run: |
          if [ -n "${{ inputs.env1Name }}" ]; then
            echo "${{ inputs.env1Name }}=${{ secrets.ENV_1_VALUE }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.env2Name }}" ]; then
            echo "${{ inputs.env2Name }}=${{ secrets.ENV_2_VALUE }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.env3Name }}" ]; then
            echo "${{ inputs.env3Name }}=${{ secrets.ENV_3_VALUE }}" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4
        with:
            lfs: true

        # must run before gradle/gradle-build-action
      - name: Validate Gradle wrapper JAR files
        if: ${{ inputs.build-gradle }}
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: ${{ inputs.node-version }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      - name: Setup Gradle
        if: ${{ inputs.build-gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ inputs.gradle-action-cache-disable }}

      - name: Get Tag Version
        shell: bash
        run: |
          echo "GITHUB_ACTIONS_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          echo "GITHUB_ACTIONS_PULL_REQUEST=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: perfectsense/brightspot-github-actions-workflows
          ref: v2
          path: ./brightspot

      - name: Maven Cache
        if: ${{ inputs.build-maven }}
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: NPM Cache
        if: ${{ inputs.cache-npm}}
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.yarn/cache
            ~/.config/yarn/global
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Build with Maven
        if: ${{ inputs.build-maven }}
        shell: bash
        run: ./brightspot/brightspot/build-maven.sh

      - name: Build with Gradle
        if: ${{ inputs.build-gradle }}
        shell: bash
        env:
          GRADLE_CACHE_USERNAME: ${{ secrets.GRADLE_CACHE_USERNAME }}
          GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}
          GRADLE_PARAMS: ${{ inputs.gradle-params }}
        run: ./brightspot/brightspot/build-gradle.sh

      - name: Publish JUnit test reports
        uses: mikepenz/action-junit-report@v5
        if: ${{ inputs.build-gradle && !cancelled() }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      # Inline Sonar (sonar: 'inline'). Reuses this build job's compiled classes,
      # test results, and coverage — no re-build, so coverage is real. Runs on the
      # build runner and on this job's JDK, so java-version MUST be 17+ (the Sonar
      # scanner minimum); on Java <17 the scanner errors. A failure here fails the
      # build job. For the separate-runner / Java-21 path, use `sonar: job` instead.
      - name: Read the `sonar` custom property
        id: sonar-property
        if: ${{ inputs.sonar == 'inline' && inputs.build-gradle }}
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.request('GET /repos/{owner}/{repo}/properties/values', {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const property = data.find(p => p.property_name === 'sonar');
            const value = property && property.value ? String(property.value) : '';
            core.info(`sonar custom property: '${value}'`);
            if (!value) {
              core.warning("The 'sonar' custom property is not set on this repository; skipping Sonar. Contact an Admin to enable it.");
            }
            core.setOutput('value', value);

      - name: Configure Sonar host and token from the `sonar` property
        if: ${{ inputs.sonar == 'inline' && steps.sonar-property.outputs.value != '' }}
        env:
          # The `sonar` property selects the SonarQube instance, e.g. 02 -> https://02.sonarqube.brightspot.tools/
          INSTANCE: ${{ steps.sonar-property.outputs.value }}
          # Dynamic secret SONAR_TOKEN_<instance>; the caller must use `secrets: inherit` for it to resolve.
          SONAR_TOKEN_DYNAMIC: ${{ secrets[format('SONAR_TOKEN_{0}', steps.sonar-property.outputs.value)] }}
        run: |
          echo "SONAR_HOST_URL=https://${INSTANCE}.sonarqube.brightspot.tools/" >> "$GITHUB_ENV"
          echo "SONAR_TOKEN=${SONAR_TOKEN_DYNAMIC}" >> "$GITHUB_ENV"

      - name: Inline Sonar analysis
        if: ${{ inputs.sonar == 'inline' && env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Reuses the compiled classes, tests, and coverage from the build above
          # (no re-build). Uses this job's JDK — java-version must be 17+.
          ./gradlew sonar -i -Dsonar.projectKey="perfectsense_${{ github.event.repository.name }}"

      - name: Store Build
        if: ${{ inputs.build-gradle || inputs.build-maven }}
        uses: actions/upload-artifact@v4
        with:
            name: brightspot-build
            path: ${{ inputs.war-build-dir }}
            retention-days: 2

      - name: Find Brightspot Version
        if: ${{ inputs.build-gradle || inputs.build-maven }}
        run: ./brightspot/analysis/brightspot-version.sh > brightspot-version.txt
        shell: bash

      - name: Store Brightspot Version
        if: ${{ inputs.build-gradle || inputs.build-maven }}
        uses: actions/upload-artifact@v4
        with:
            name: brightspot-version
            path: brightspot-version.txt
            retention-days: 2

  # Sonar analysis (sonar: 'job' mode — the default). Delegates to the standalone
  # brightspot-sonar.yml workflow on its own runner pool (sonar-ubuntu-22.04-4core),
  # with the SAME Java/Node toolchain as the build (forwarded below). Sonar requires
  # Java 17+. Runs after `build`, in PARALLEL with the deploy job(s) below — both
  # only need `build`, so Sonar never blocks or delays the bundled deploy. Runs only
  # when the repo has the `sonar` custom property set.
  #
  # NOTE: this still gates an EXTERNAL deploy (a consumer that sets deploy: none and
  # runs its own deploy job needing this whole workflow) — use the bundled `deploy`
  # input instead, or run brightspot-sonar.yml as a separate top-level job, to avoid
  # that. `sonar: inline` also delays the deploy (it runs inside the build job).
  sonar:
    name: "Sonar"
    needs: build
    if: ${{ inputs.sonar == 'job' && github.actor != 'dependabot[bot]' }}
    uses: ./.github/workflows/brightspot-sonar.yml
    secrets: inherit
    with:
      # Sonar uses the same toolchain as the build (must be Java 17+).
      java-distribution: ${{ inputs.java-distribution }}
      java-version: ${{ inputs.java-version }}
      node-version: ${{ inputs.node-version }}
      gradle-action-cache-disable: ${{ inputs.gradle-action-cache-disable }}

  # Deploy (deploy: 'aws'). Sibling of `sonar` — both only need `build`, so they run
  # in parallel and Sonar never delays the deploy. Consumes the `brightspot-build`
  # artifact. Requires the caller to use `secrets: inherit` so the AWS / Ops Desk
  # secrets resolve. deploy-project and deploy-region are required by the AWS deploy.
  deploy-aws:
    name: "Deploy (AWS)"
    needs: build
    if: ${{ inputs.deploy == 'aws' }}
    uses: ./.github/workflows/aws-cloud-deploy.yml
    secrets: inherit
    with:
      project: ${{ inputs.deploy-project }}
      repository: ${{ inputs.deploy-repository }}
      region: ${{ inputs.deploy-region }}

  # Deploy (deploy: 'gcp'). Sibling of `sonar` (parallel, never blocked by Sonar).
  # Requires `secrets: inherit` for GCP_GCR_SECRET_KEY. deploy-project and
  # deploy-registry are required by the GCP deploy.
  deploy-gcp:
    name: "Deploy (GCP)"
    needs: build
    if: ${{ inputs.deploy == 'gcp' }}
    uses: ./.github/workflows/gcp-cloud-deploy.yml
    secrets: inherit
    with:
      project: ${{ inputs.deploy-project }}
      repository: ${{ inputs.deploy-repository }}
      registry: ${{ inputs.deploy-registry }}
