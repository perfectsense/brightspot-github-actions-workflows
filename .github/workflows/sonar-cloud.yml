name: 'SonarCloud'

on:
  workflow_call:
    inputs:
      gradle-params:
        description: 'Extra parameters to pass to Gradle command'
        required: false
        type: string

      gradle-action-cache-disable:
        description: 'Enable only if not using Gradle Remote Cache'
        required: false
        default: true
        type: boolean

      java-distribution:
        description: 'Java distribution'
        required: false
        default: 'temurin'
        type: string

      java-version:
        description: >-
          JDK that runs the build. Passed to actions/setup-java verbatim, so
          pins such as '21.0.2' or '25' are honored as written. Set this to the
          JDK your build/deploy workflow uses (e.g. '11') so this job's Gradle
          cache keys match those warm remote-cache entries and the expensive
          test and bytecode-enhancement tasks are reused rather than re-run.

          The Sonar scan runs on max(java-version, 21), because the scanner will
          not run on an older JDK. When java-version is already 21 or newer both
          run on it — one JDK, one Gradle daemon, no seam. When it is lower the
          scan is raised to 21 and a warning is emitted; that direction is safe
          because analysing older bytecode on a newer JDK is the tolerable one,
          and versions.java (which drives --release) must already be <=
          java-version for the build to compile at all.
        required: false
        default: '21'
        type: string

      node-version:
        description: 'Node version'
        required: false
        default: '16.11.0'
        type: string

      cache-npm:
        description: 'Cache NPM'
        default: true
        type: boolean

      runs-on:
        description: Platform to execute on
        type: string
        default: sonar-ubuntu-22.04-4core

      sonar-cloud-enabled:
        description: 'Enable SonarCloud Code Analysis'
        default: true
        type: boolean

      sonar-organization:
        type: string
        default: "perfectsense"

      sonar-host-url:
        type: string
        default: "https://sonarcloud.io"

      sonar-project-key:
        type: string
        required: false

      env1Name:
        description: Name for environment variable #1 (value is passed via secrets)
        type: string
      env2Name:
        description: Name for environment variable #2 (value is passed via secrets)
        type: string
      env3Name:
        description: Name for environment variable #3 (value is passed via secrets)
        type: string

    secrets:
      ENV_1_VALUE:
        required: false
      ENV_2_VALUE:
        required: false
      ENV_3_VALUE:
        required: false
      GRADLE_CACHE_USERNAME:
        required: false
      GRADLE_CACHE_PASSWORD:
        required: false
      SONAR_TOKEN:
        required: false
jobs:
  sonar-cloud:
    name: "Sonar Cloud"
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      STYLEGUIDE_BUILD_OPTS: -s
      SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
    outputs:
      sonar-project-name: ${{ steps.sonar-project-name.outputs.sonar-project }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Set Environment Variables
        run: |
          if [ -n "${{ inputs.env1Name }}" ]; then
            echo "${{ inputs.env1Name }}=${{ secrets.ENV_1_VALUE }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.env2Name }}" ]; then
            echo "${{ inputs.env2Name }}=${{ secrets.ENV_2_VALUE }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.env3Name }}" ]; then
            echo "${{ inputs.env3Name }}=${{ secrets.ENV_3_VALUE }}" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
            node-version: ${{ inputs.node-version }}

      # The build runs on java-version as given, so its Gradle cache keys can
      # match the build/deploy workflow's warm remote-cache entries. The scanner
      # will not run on a JDK older than 21, so it runs on max(java-version, 21)
      # — clamped here rather than failing deep inside the Gradle invocation with
      # an unrelated-looking error. When java-version is already 21 or newer both
      # resolve to it and the two setup-java steps below collapse to one JDK.
      - name: Resolve build and scanner JDKs
        id: resolve-jdks
        shell: bash
        env:
          REQUESTED: ${{ inputs.java-version }}
        run: |
          set -euo pipefail
          # Strip everything from the first '.' or '-' to get the feature release:
          # '21' -> 21, '21.0.2' -> 21, '21.x' -> 21, '21-ea' -> 21.
          major="${REQUESTED%%[.-]*}"
          if [[ "$major" =~ ^[0-9]+$ ]]; then
            # Parseable: honour it for the build, floor it for the scanner.
            build="$REQUESTED"
            if (( major >= 21 )); then
              scanner="$REQUESTED"
            else
              echo "::warning title=Sonar scanner JDK raised to 21::java-version '${REQUESTED}' is below the Sonar scanner minimum of 21; the scan will run on 21 while the build stays on '${REQUESTED}'."
              scanner=21
            fi
          else
            # Unparseable: we cannot honour it for either, so use 21 for both.
            echo "::warning title=JDK defaulted to 21::Could not parse java-version '${REQUESTED}'; using 21 for both the build and the scan."
            build=21
            scanner=21
          fi
          echo "Requested java-version: '${REQUESTED}' -> build '${build}', scanner '${scanner}'"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "scanner=${scanner}" >> "$GITHUB_OUTPUT"

      # Both JDKs are installed by setup-java unconditionally, even when the two
      # versions are equal. Never fall back to a JAVA_HOME_<n>_X64 runner
      # variable or any other image-provided JDK: those are image-dependent and
      # silently expand to empty when absent, which is what made the scan run on
      # 17 regardless of this input in the first place. A redundant second call
      # for an already-installed version is a fast no-op.
      - name: Set up build JDK
        id: setup-build-jdk
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.resolve-jdks.outputs.build }}
          distribution: ${{ inputs.java-distribution }}

      - name: Set up scanner JDK
        id: setup-scanner-jdk
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.resolve-jdks.outputs.scanner }}
          distribution: ${{ inputs.java-distribution }}

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Sonar Cloud Project Key
        id: sonar-project-name
        shell: bash
        run: |
          SONAR_PROJECT=""
          if [[ ! -z "${{ inputs.sonar-project-key }}" ]]; then
            SONAR_PROJECT=${{ inputs.sonar-project-key }}
          else
            SONAR_PROJECT=perfectsense_${{ github.event.repository.name }}
          fi
          echo "sonar-project=$(echo $SONAR_PROJECT)" >> $GITHUB_OUTPUT

      # Runs the default task (`build` for Brightspot projects), so this is where
      # compilation, tests and the JaCoCo report happen. It runs on the build JDK
      # so its cache keys match the build/deploy workflow's.
      - name: Build
        if: ${{ inputs.sonar-cloud-enabled && env.SONAR_TOKEN != '' && github.actor != 'dependabot[bot]' }}
        env:
          JAVA_HOME: ${{ steps.setup-build-jdk.outputs.path }}
        run: ./gradlew --scan

      # The scan steps run on the scanner JDK, which is >= 21. When that differs
      # from the build JDK the `sonar` task recompiles on it, since the compiler
      # is a Gradle task input — the expensive test and enhancement work is still
      # reused from the Build step above.
      - name: SonarCloud Code Version
        if: ${{ inputs.sonar-cloud-enabled && env.SONAR_TOKEN != '' && startsWith(github.ref, 'refs/tags/v') && github.actor != 'dependabot[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_HOME: ${{ steps.setup-scanner-jdk.outputs.path }}
        run: |
          version=$(git describe --tags --match "v[0-9]*" --abbrev=0 HEAD || echo "0")
          version=${version/v/}
          echo "Creating a new analysis for version ${version}"
          ./gradlew -x test sonar -i -Dsonar.organization="${{ inputs.sonar-organization }}" -Dsonar.projectKey="${{ steps.sonar-project-name.outputs.sonar-project }}" -Dsonar.projectVersion="${version}"

      - name: SonarCloud Code Analysis
        if: ${{ inputs.sonar-cloud-enabled && env.SONAR_TOKEN != '' && startsWith(github.ref, 'refs/tags/v') != true && github.actor != 'dependabot[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_HOME: ${{ steps.setup-scanner-jdk.outputs.path }}
        run: |
          ./gradlew -x test sonar -i -Dsonar.organization="${{ inputs.sonar-organization }}" -Dsonar.projectKey="${{ steps.sonar-project-name.outputs.sonar-project }}"

