name: 'SonarCloud'

on:
  workflow_call:
    inputs:
      gradle-params:
        description: 'Extra parameters to pass to Gradle command'
        required: false
        type: string

      gradle-action-cache-disable:
        description: 'Enable only if not using Gradle Remote Cache'
        required: false
        default: true
        type: boolean

      java-distribution:
        description: 'Java distribution'
        required: false
        default: 'temurin'
        type: string

      java-version:
        description: >-
          JDK that runs the build and the Sonar scanner. The scanner requires 21
          or newer, so values below 21 (or values that cannot be parsed) are
          raised to 21 and a warning is emitted. Values of 21 or newer are passed
          through to actions/setup-java verbatim, so specific pins such as
          '21.0.2' or '25' are honored as written.
        required: false
        default: '21'
        type: string

      node-version:
        description: 'Node version'
        required: false
        default: '16.11.0'
        type: string

      cache-npm:
        description: 'Cache NPM'
        default: true
        type: boolean

      runs-on:
        description: Platform to execute on
        type: string
        default: sonar-ubuntu-22.04-4core

      sonar-cloud-enabled:
        description: 'Enable SonarCloud Code Analysis'
        default: true
        type: boolean

      sonar-organization:
        type: string
        default: "perfectsense"

      sonar-host-url:
        type: string
        default: "https://sonarcloud.io"

      sonar-project-key:
        type: string
        required: false

      env1Name:
        description: Name for environment variable #1 (value is passed via secrets)
        type: string
      env2Name:
        description: Name for environment variable #2 (value is passed via secrets)
        type: string
      env3Name:
        description: Name for environment variable #3 (value is passed via secrets)
        type: string

    secrets:
      ENV_1_VALUE:
        required: false
      ENV_2_VALUE:
        required: false
      ENV_3_VALUE:
        required: false
      GRADLE_CACHE_USERNAME:
        required: false
      GRADLE_CACHE_PASSWORD:
        required: false
      SONAR_TOKEN:
        required: false
jobs:
  sonar-cloud:
    name: "Sonar Cloud"
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      STYLEGUIDE_BUILD_OPTS: -s
      SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
    outputs:
      sonar-project-name: ${{ steps.sonar-project-name.outputs.sonar-project }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Set Environment Variables
        run: |
          if [ -n "${{ inputs.env1Name }}" ]; then
            echo "${{ inputs.env1Name }}=${{ secrets.ENV_1_VALUE }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.env2Name }}" ]; then
            echo "${{ inputs.env2Name }}=${{ secrets.ENV_2_VALUE }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.env3Name }}" ]; then
            echo "${{ inputs.env3Name }}=${{ secrets.ENV_3_VALUE }}" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: ${{ inputs.node-version }}

      # The Sonar scanner will not run on a JDK older than 21, so clamp the
      # requested version up to that floor rather than failing deep inside the
      # Gradle invocation with an unrelated-looking error. Anything already at 21
      # or above is passed through untouched so version pins survive.
      - name: Resolve scanner JDK
        id: scanner-jdk
        shell: bash
        env:
          REQUESTED: ${{ inputs.java-version }}
        run: |
          set -euo pipefail
          # Strip everything from the first '.' or '-' to get the feature release:
          # '21' -> 21, '21.0.2' -> 21, '21.x' -> 21, '21-ea' -> 21.
          major="${REQUESTED%%[.-]*}"
          if [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 21 )); then
            resolved="$REQUESTED"
          else
            if [[ "$major" =~ ^[0-9]+$ ]]; then
              echo "::warning title=Sonar JDK raised to 21::java-version '${REQUESTED}' is below the Sonar scanner minimum of 21; using 21 instead."
            else
              echo "::warning title=Sonar JDK defaulted to 21::Could not parse java-version '${REQUESTED}'; using 21 instead."
            fi
            resolved=21
          fi
          echo "Requested java-version: '${REQUESTED}' -> using '${resolved}'"
          echo "value=${resolved}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        id: setup-jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.scanner-jdk.outputs.value }}
          distribution: ${{ inputs.java-distribution }}

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Sonar Cloud Project Key
        id: sonar-project-name
        shell: bash
        run: |
          SONAR_PROJECT=""
          if [[ ! -z "${{ inputs.sonar-project-key }}" ]]; then
            SONAR_PROJECT=${{ inputs.sonar-project-key }}
          else
            SONAR_PROJECT=perfectsense_${{ github.event.repository.name }}
          fi
          echo "sonar-project=$(echo $SONAR_PROJECT)" >> $GITHUB_OUTPUT

      - name: Build
        if: ${{ inputs.sonar-cloud-enabled && env.SONAR_TOKEN != '' && github.actor != 'dependabot[bot]' }}
        env:
          JAVA_HOME: ${{ steps.setup-jdk.outputs.path }}
        run: ./gradlew --scan

      # JAVA_HOME is set from the setup-java step output rather than a hardcoded
      # JAVA_HOME_<n>_X64 runner variable: those are image-dependent, silently
      # expand to empty when the image lacks that JDK, and override the
      # java-version the caller asked for.
      - name: SonarCloud Code Version
        if: ${{ inputs.sonar-cloud-enabled && env.SONAR_TOKEN != '' && startsWith(github.ref, 'refs/tags/v') && github.actor != 'dependabot[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_HOME: ${{ steps.setup-jdk.outputs.path }}
        run: |
          version=$(git describe --tags --match "v[0-9]*" --abbrev=0 HEAD || echo "0")
          version=${version/v/}
          echo "Creating a new analysis for version ${version}"
          ./gradlew -x test sonar -i -Dsonar.organization="${{ inputs.sonar-organization }}" -Dsonar.projectKey="${{ steps.sonar-project-name.outputs.sonar-project }}" -Dsonar.projectVersion="${version}"

      - name: SonarCloud Code Analysis
        if: ${{ inputs.sonar-cloud-enabled && env.SONAR_TOKEN != '' && startsWith(github.ref, 'refs/tags/v') != true && github.actor != 'dependabot[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_HOME: ${{ steps.setup-jdk.outputs.path }}
        run: |
          ./gradlew -x test sonar -i -Dsonar.organization="${{ inputs.sonar-organization }}" -Dsonar.projectKey="${{ steps.sonar-project-name.outputs.sonar-project }}"

